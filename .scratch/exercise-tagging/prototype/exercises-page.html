<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Exercises page — prototype (B + type filter, 3 variants)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<!--
  THROWAWAY PROTOTYPE — not part of the app build, do not import from src/.
  Round 2, built on the winning "B — Jump rail" shape from round 1 (sticky
  muscle-group index strip + collapsed create-form disclosure). Question this
  round: exercise.type is strength/stretch/mobility (see
  src/data/exerciseSeed.json, EXERCISE_TYPES in src/store/types.ts) — each
  exercise has exactly one, so this is a single-select scope filter, not an
  open multi-select tag set. Where does that control live relative to the
  muscle-group rail?

  Three variants of B, switchable via ?variant=B1|B2|B3 or the bottom bar,
  all sharing B's disclosure-panel create form and jump-to-group rail:
  B1 — Segmented row: a full-width All/Strength/Stretch/Mobility segmented
       control as its own permanent row between search and the muscle rail.
       Always visible, costs one row of vertical chrome.
  B2 — Merged rail: type chips fold into the same sticky horizontal strip as
       the muscle-group pills (divider between them), so there's still only
       one strip of chrome, just two chip families sharing it.
  B3 — Popover scope: a compact "Type: All ▾" trigger next to the search box
       opens a small dropdown of the 4 options; zero permanent chrome when
       closed, matching Apple HIG's "only show filters that are relevant and
       contextual" guidance from research-mobile-filter-ui.md — but the
       active filter is one tap less visible at a glance than B1/B2.
-->
<style>
  :root {
    --background: oklch(0 0 0);
    --foreground: oklch(0.9328 0.0025 228.7857);
    --card: oklch(0.2097 0.0080 274.5332);
    --card-foreground: oklch(0.8853 0 0);
    --primary: oklch(0.5914 0.2411 29.0849);
    --primary-foreground: oklch(1.0000 0 0);
    --muted: oklch(0.2090 0 0);
    --muted-foreground: oklch(0.5637 0.0078 247.9662);
    --accent: oklch(0.1928 0.0331 242.5459);
    --accent-foreground: oklch(0.6108 0.2377 28.1203);
    --border: oklch(0.2674 0.0047 248.0045);
    --input: oklch(0.1149 0 0);
    --ring: oklch(0.6117 0.2395 28.2376);
    --radius: 0.7rem;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: 'Geist', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .heading-font { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  main {
    max-width: 28rem;
    margin: 0 auto;
    padding: 1rem;
    padding-bottom: 6rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-height: 100vh;
  }

  h1.page-heading {
    font-size: 2.5rem;
    line-height: 1;
    margin: 0;
  }

  input[type="text"], select {
    width: 100%;
    height: 2.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--input);
    color: var(--foreground);
    padding: 0 0.75rem;
    font-size: 0.9375rem;
    outline: none;
  }
  input[type="text"]::placeholder { color: var(--muted-foreground); }
  input[type="text"]:focus, select:focus, button:focus-visible {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 45%, transparent);
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border-radius: var(--radius);
    border: 1px solid transparent;
    font-size: 0.875rem;
    font-weight: 500;
  }
  .btn-primary {
    background: var(--primary);
    color: var(--primary-foreground);
    padding: 0 1rem;
    height: 2.5rem;
    white-space: nowrap;
  }
  .btn-outline {
    background: transparent;
    border-color: var(--border);
    color: var(--foreground);
    padding: 0.5rem 0.75rem;
  }
  .btn-ghost {
    background: transparent;
    color: var(--muted-foreground);
    padding: 0.375rem 0.5rem;
  }
  .btn-destructive {
    background: transparent;
    border-color: var(--border);
    color: oklch(0.6188 0.2376 25.7658);
    padding: 0.375rem 0.6rem;
    font-size: 0.8125rem;
  }
  .btn-outline.small, .btn-destructive { font-size: 0.8125rem; height: 2rem; }

  .section-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted-foreground);
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
  }
  .section-label .count { font-family: 'JetBrains Mono', monospace; opacity: 0.7; }

  .exercise-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.5rem 0.65rem;
    background: color-mix(in oklab, var(--card) 40%, transparent);
  }
  .exercise-row .name { flex: 1; font-size: 0.9375rem; }
  .exercise-row .tag { font-size: 0.75rem; color: var(--muted-foreground); margin-left: 0.4rem; }

  .row-actions { display: flex; gap: 0.35rem; }

  .empty-state {
    color: var(--muted-foreground);
    font-size: 0.9375rem;
    padding: 1.5rem 0.25rem;
    text-align: center;
  }

  fieldset { border: none; margin: 0; padding: 0; }
  legend { font-size: 0.8125rem; color: var(--muted-foreground); padding: 0; margin-bottom: 0.25rem; }
  .checkbox-grid { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; }
  .checkbox-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8125rem; color: var(--muted-foreground); }
  .checkbox-item input { width: 1rem; height: 1rem; accent-color: var(--primary); }

  .field-label {
    font-size: 0.75rem;
    color: var(--muted-foreground);
    display: block;
    margin-bottom: 0.25rem;
  }
  .field { display: flex; flex-direction: column; }

  /* ---------- Disclosure (variant A & B create form) ---------- */
  .disclosure-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted-foreground);
    padding: 0.6rem 0.75rem;
    font-size: 0.875rem;
  }
  .disclosure-trigger .plus { color: var(--accent-foreground); font-weight: 600; }
  .disclosure-panel {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    background: color-mix(in oklab, var(--card) 55%, transparent);
  }
  .disclosure-panel[hidden] { display: none; }
  .row-2 { display: flex; gap: 0.5rem; }

  /* ---------- Variant B: jump rail ---------- */
  .jump-rail {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    padding: 0.35rem 0.1rem;
    background: linear-gradient(var(--background) 75%, transparent);
    scrollbar-width: none;
  }
  .jump-rail::-webkit-scrollbar { display: none; }
  .jump-pill {
    flex: none;
    font-size: 0.75rem;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--muted);
    color: var(--muted-foreground);
    white-space: nowrap;
  }
  .jump-pill.active {
    background: var(--accent-foreground);
    color: oklch(0.15 0 0);
    border-color: var(--accent-foreground);
  }

  /* ---------- B1: segmented control row ---------- */
  .segmented {
    display: flex;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .segmented button {
    flex: 1;
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--muted-foreground);
    padding: 0.5rem 0.25rem;
    font-size: 0.8125rem;
    border-right: 1px solid var(--border);
  }
  .segmented button:last-child { border-right: none; }
  .segmented button.active {
    background: var(--accent-foreground);
    color: oklch(0.15 0 0);
    font-weight: 600;
  }

  /* ---------- B2: merged rail (type chips + divider + muscle pills) ---------- */
  .rail-divider {
    flex: none;
    width: 1px;
    align-self: stretch;
    background: var(--border);
    margin: 0 0.15rem;
  }
  .type-pill {
    flex: none;
    font-size: 0.75rem;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--accent-foreground);
    background: transparent;
    color: var(--accent-foreground);
    white-space: nowrap;
  }
  .type-pill.active {
    background: var(--accent-foreground);
    color: oklch(0.15 0 0);
  }

  /* ---------- B3: popover scope control ---------- */
  .scope-wrap { position: relative; flex: none; }
  .scope-trigger {
    height: 2.5rem;
    padding: 0 0.75rem;
    border: 1px solid var(--border);
    background: var(--input);
    color: var(--foreground);
    font-size: 0.8125rem;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .scope-trigger .current { color: var(--accent-foreground); font-weight: 600; }
  .scope-menu {
    position: absolute;
    top: calc(100% + 0.35rem);
    right: 0;
    background: oklch(0.16 0.005 274);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.25rem;
    display: flex;
    flex-direction: column;
    min-width: 9rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 10;
  }
  .scope-menu button {
    text-align: left;
    background: transparent;
    border: none;
    border-radius: calc(var(--radius) - 0.2rem);
    color: var(--foreground);
    padding: 0.5rem 0.6rem;
    font-size: 0.875rem;
  }
  .scope-menu button.active { color: var(--accent-foreground); font-weight: 600; }
  .scope-menu button:hover { background: var(--muted); }

  /* ---------- Variant C: search-led ---------- */
  .search-hero {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--input);
    padding: 0 0.75rem;
    height: 3rem;
  }
  .search-hero svg { flex: none; color: var(--muted-foreground); }
  .search-hero input {
    border: none;
    background: transparent;
    height: 100%;
    padding: 0;
    font-size: 1rem;
  }
  .search-hero input:focus { box-shadow: none; }
  .create-cta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    border: 1px dashed var(--accent-foreground);
    border-radius: var(--radius);
    padding: 0.75rem;
    background: color-mix(in oklab, var(--accent) 70%, transparent);
  }
  .create-cta p { margin: 0; font-size: 0.875rem; }
  .create-cta strong { color: var(--foreground); }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted-foreground);
    width: 2.5rem;
    height: 2.5rem;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }

  /* ---------- switcher bar ---------- */
  #proto-switcher {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: #111;
    border: 1px solid #444;
    border-radius: 999px;
    padding: 0.4rem 0.6rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    font-family: 'Geist', system-ui, sans-serif;
    z-index: 50;
  }
  #proto-switcher button {
    background: #262626;
    color: #fff;
    border: 1px solid #555;
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    font-size: 1rem;
    line-height: 1;
  }
  #proto-switcher .label {
    color: #eee;
    font-size: 0.8125rem;
    min-width: 11rem;
    text-align: center;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<main id="app"></main>

<div id="proto-switcher">
  <button id="proto-prev" aria-label="Previous variant">←</button>
  <span class="label" id="proto-label"></span>
  <button id="proto-next" aria-label="Next variant">→</button>
</div>

med": true}, {"name": "Chest Opener Mobility Drill", "primaryMuscleGroup": "chest", "type": "mobility"}, {"name": "Child's Pose Stretch", "primaryMuscleGroup": "back", "type": "stretch", "isTimed": true}, {"name": "Cat-Cow Mobility Drill", "primaryMuscleGroup": "back", "type": "mobility"}, {"name": "Cross-Body Shoulder Stretch", "primaryMuscleGroup": "shoulders", "type": "stretch", "isTimed": true, "isUnilateral": true}, {"name": "Shoulder Circles Mobility Drill", "primaryMuscleGroup": "shoulders", "type": "mobility"}, {"name": "Wall Biceps Stretch", "primaryMuscleGroup": "biceps", "type": "stretch", "isTimed": true, "isUnilateral": true}, {"name": "Biceps Curl Mobility Drill", "primaryMuscleGroup": "biceps", "type": "mobility"}, {"name": "Overhead Triceps Stretch", "primaryMuscleGroup": "triceps", "type": "stretch", "isTimed": true, "isUnilateral": true}, {"name": "Triceps Band Mobility Drill", "primaryMuscleGroup": "triceps", "type": "mobility"}, {"name": "Wrist Flexor Stretch", "primaryMuscleGroup": "forearms", "type": "stretch", "isTimed": true, "isUnilateral": true}, {"name": "Wrist Circles Mobility Drill", "primaryMuscleGroup": "forearms", "type": "mobility"}, {"name": "Standing Quad Stretch", "primaryMuscleGroup": "quads", "type": "stretch", "isTimed": true, "isUnilateral": true}, {"name": "Lateral Leg Swing Mobility Drill", "primaryMuscleGroup": "quads", "type": "mobility", "isUnilateral": true}, {"name": "Standing Hamstring Stretch", "primaryMuscleGroup": "hamstrings", "type": "stretch", "isTimed": true, "isUnilateral": true}, {"name": "Forward Leg Swing Mobility Drill", "primaryMuscleGroup": "hamstrings", "type": "mobility", "isUnilateral": true}, {"name": "Pigeon Pose Stretch", "primaryMuscleGroup": "glutes", "type": "stretch", "isTimed": true, "isUnilateral": true}, {"name": "Fire Hydrant Mobility Drill", "primaryMuscleGroup": "glutes", "type": "mobility", "isUnilateral": true}, {"name": "Standing Calf Stretch", "primaryMuscleGroup": "calves", "type": "stretch", "isTimed": true, "isUnilateral": true}, {"name": "Ankle Circles Mobility Drill", "primaryMuscleGroup": "calves", "type": "mobility", "isUnilateral": true}, {"name": "Cobra Stretch", "primaryMuscleGroup": "core", "type": "stretch", "isTimed": true}, {"name": "Trunk Rotation Mobility Drill", "primaryMuscleGroup": "core", "type": "mobility"}, {"name": "Neck Side Stretch", "primaryMuscleGroup": "neck", "type": "stretch", "isTimed": true, "isUnilateral": true}, {"name": "Neck Circles Mobility Drill", "primaryMuscleGroup": "neck", "type": "mobility"}];

const GROUP_LABELS = {
  chest: 'Chest', back: 'Back', shoulders: 'Shoulders', biceps: 'Biceps',
  triceps: 'Triceps', forearms: 'Forearms', quads: 'Quads', hamstrings: 'Hamstrings',
  glutes: 'Glutes', calves: 'Calves', core: 'Core', neck: 'Neck',
};
const GROUP_ORDER = Object.keys(GROUP_LABELS);
const TYPE_LABELS = { strength: 'Strength', stretch: 'Stretch', mobility: 'Mobility' };

function groupExercises(list) {
  const byGroup = new Map();
  for (const g of GROUP_ORDER) byGroup.set(g, []);
  for (const ex of list) byGroup.get(ex.primaryMuscleGroup).push(ex);
  return GROUP_ORDER
    .map((g) => ({ group: g, exercises: byGroup.get(g) }))
    .filter((entry) => entry.exercises.length > 0);
}

function filterByName(list, query) {
  const q = query.trim().toLowerCase();
  if (!q) return list;
  return list.filter((ex) => ex.name.toLowerCase().includes(q));
}

const TYPE_ORDER = ['all', 'strength', 'stretch', 'mobility'];
const TYPE_FILTER_LABELS = { all: 'All', ...TYPE_LABELS };

function filterByType(list, type) {
  if (type === 'all') return list;
  return list.filter((ex) => ex.type === type);
}

function exerciseTags(ex) {
  const tags = [`(${TYPE_LABELS[ex.type]})`];
  if (ex.isUnilateral) tags.push('(unilateral)');
  if (ex.isTimed) tags.push('(timed)');
  return tags.join(' ');
}

// ---------------------------------------------------------------------
// Shared bits
// ---------------------------------------------------------------------
function renderList(list) {
  if (list.length === 0) {
    return `<p class="empty-state">No exercises match your search.</p>`;
  }
  const groups = groupExercises(list);
  return `<div style="display:flex; flex-direction:column; gap:1rem;">
    ${groups.map(({ group, exercises }) => `
      <div id="group-${group}" style="display:flex; flex-direction:column; gap:0.35rem;">
        <div class="section-label">${GROUP_LABELS[group]} <span class="count">${exercises.length}</span></div>
        <ul style="list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0.35rem;">
          ${exercises.map((ex) => `
            <li class="exercise-row">
              <span class="name">${ex.name}<span class="tag">${exerciseTags(ex)}</span></span>
              <span class="row-actions">
                <button class="btn-outline small">Rename</button>
                <button class="btn-destructive">Delete</button>
              </span>
            </li>`).join('')}
        </ul>
      </div>`).join('')}
  </div>`;
}

function createFormFieldsHtml(idPrefix) {
  return `
    <div class="row-2">
      <div class="field" style="flex:1;">
        <label class="field-label" for="${idPrefix}-pmg">Primary muscle group</label>
        <select id="${idPrefix}-pmg">
          ${GROUP_ORDER.map((g) => `<option>${GROUP_LABELS[g]}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="flex:1;">
        <label class="field-label" for="${idPrefix}-type">Type</label>
        <select id="${idPrefix}-type">
          <option>Strength</option><option>Stretch</option><option>Mobility</option>
        </select>
      </div>
    </div>
    <fieldset>
      <legend>Other muscle groups</legend>
      <div class="checkbox-grid">
        ${GROUP_ORDER.filter((g) => g !== 'chest').map((g) => `
          <label class="checkbox-item"><input type="checkbox" />${GROUP_LABELS[g]}</label>
        `).join('')}
      </div>
    </fieldset>
    <div style="display:flex; gap:1rem;">
      <label class="checkbox-item"><input type="checkbox" />Unilateral</label>
      <label class="checkbox-item"><input type="checkbox" />Timed</label>
    </div>`;
}

// ---------------------------------------------------------------------
// Shared: create-form disclosure (identical across B1/B2/B3 — the type
// filter is what differs between these three, not the create flow)
// ---------------------------------------------------------------------
function createDisclosureHtml(idPrefix, state) {
  return `
    <button id="${idPrefix}-toggle-create" class="disclosure-trigger" aria-expanded="${state.createOpen}">
      <span><span class="plus">+</span> New exercise</span>
      <span>${state.createOpen ? '▲' : '▼'}</span>
    </button>
    <div class="disclosure-panel" ${state.createOpen ? '' : 'hidden'}>
      <div class="row-2">
        <input type="text" placeholder="Exercise name" aria-label="New exercise name" style="flex:1;" />
        <button class="btn-primary">Add</button>
      </div>
      ${createFormFieldsHtml(`${idPrefix}-new`)}
    </div>`;
}

function wireCreateDisclosure(idPrefix, state, rerender) {
  document.getElementById(`${idPrefix}-toggle-create`).addEventListener('click', () => {
    state.createOpen = !state.createOpen;
    rerender();
  });
}

// Jump-rail scroll-spy + click-to-scroll, shared by all three (muscle pills
// only — B2 additionally scopes to `.jump-pill[data-group]` inside its
// merged strip, which matches the same selector).
function wireJumpRail(railEl) {
  railEl.querySelectorAll('.jump-pill[data-group]').forEach((pill) => {
    pill.addEventListener('click', () => {
      const target = document.getElementById(`group-${pill.dataset.group}`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  function updateActivePill() {
    const railTop = railEl.getBoundingClientRect().bottom;
    let current = null;
    document.querySelectorAll('[id^="group-"]').forEach((section) => {
      const top = section.getBoundingClientRect().top;
      if (top - railTop < 40) current = section.id.replace('group-', '');
    });
    railEl.querySelectorAll('.jump-pill[data-group]').forEach((pill) => {
      pill.classList.toggle('active', pill.dataset.group === current);
    });
  }
  window.addEventListener('scroll', updateActivePill, { passive: true });
  updateActivePill();
}

function wireSearchFocus(input) {
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

// ---------------------------------------------------------------------
// B1 — Segmented row: All/Strength/Stretch/Mobility as its own permanent
// row, between search and the muscle-group rail.
// ---------------------------------------------------------------------
function renderB1(state) {
  const filtered = filterByType(filterByName(SEED, state.query), state.typeFilter);
  const activeGroups = new Set(groupExercises(filtered).map((g) => g.group));
  return `
    <h1 class="page-heading heading-font">Exercises</h1>

    ${createDisclosureHtml('b1', state)}

    <input type="text" id="b1-search" placeholder="Search exercises" aria-label="Search exercises"
      value="${state.query}" />

    <div class="segmented" role="group" aria-label="Filter by type">
      ${TYPE_ORDER.map((t) => `
        <button data-type="${t}" class="${t === state.typeFilter ? 'active' : ''}">${TYPE_FILTER_LABELS[t]}</button>
      `).join('')}
    </div>

    <nav class="jump-rail" id="b1-rail" aria-label="Jump to muscle group">
      ${GROUP_ORDER.filter((g) => activeGroups.has(g)).map((g) => `
        <button class="jump-pill" data-group="${g}">${GROUP_LABELS[g]}</button>
      `).join('')}
    </nav>

    ${renderList(filtered)}
  `;
}

function wireB1(state, rerender) {
  wireCreateDisclosure('b1', state, rerender);
  const search = document.getElementById('b1-search');
  search.addEventListener('input', (e) => { state.query = e.target.value; rerender(true); });
  wireSearchFocus(search);

  document.querySelectorAll('.segmented button').forEach((btn) => {
    btn.addEventListener('click', () => { state.typeFilter = btn.dataset.type; rerender(); });
  });

  wireJumpRail(document.getElementById('b1-rail'));
}

// ---------------------------------------------------------------------
// B2 — Merged rail: type chips + divider + muscle pills share one sticky
// horizontal strip, so there's still only one row of chrome under search.
// ---------------------------------------------------------------------
function renderB2(state) {
  const filtered = filterByType(filterByName(SEED, state.query), state.typeFilter);
  const activeGroups = new Set(groupExercises(filtered).map((g) => g.group));
  return `
    <h1 class="page-heading heading-font">Exercises</h1>

    ${createDisclosureHtml('b2', state)}

    <input type="text" id="b2-search" placeholder="Search exercises" aria-label="Search exercises"
      value="${state.query}" />

    <nav class="jump-rail" id="b2-rail" aria-label="Filter by type, jump to muscle group">
      ${TYPE_ORDER.map((t) => `
        <button class="type-pill ${t === state.typeFilter ? 'active' : ''}" data-type="${t}">${TYPE_FILTER_LABELS[t]}</button>
      `).join('')}
      <span class="rail-divider"></span>
      ${GROUP_ORDER.filter((g) => activeGroups.has(g)).map((g) => `
        <button class="jump-pill" data-group="${g}">${GROUP_LABELS[g]}</button>
      `).join('')}
    </nav>

    ${renderList(filtered)}
  `;
}

function wireB2(state, rerender) {
  wireCreateDisclosure('b2', state, rerender);
  const search = document.getElementById('b2-search');
  search.addEventListener('input', (e) => { state.query = e.target.value; rerender(true); });
  wireSearchFocus(search);

  const rail = document.getElementById('b2-rail');
  rail.querySelectorAll('.type-pill').forEach((btn) => {
    btn.addEventListener('click', () => { state.typeFilter = btn.dataset.type; rerender(); });
  });
  wireJumpRail(rail);
}

// ---------------------------------------------------------------------
// B3 — Popover scope: "Type: All ▾" next to search opens a small dropdown;
// zero permanent chrome for the type filter when it's not open.
// ---------------------------------------------------------------------
function renderB3(state) {
  const filtered = filterByType(filterByName(SEED, state.query), state.typeFilter);
  const activeGroups = new Set(groupExercises(filtered).map((g) => g.group));
  return `
    <h1 class="page-heading heading-font">Exercises</h1>

    ${createDisclosureHtml('b3', state)}

    <div style="display:flex; gap:0.5rem;">
      <input type="text" id="b3-search" placeholder="Search exercises" aria-label="Search exercises"
        value="${state.query}" style="flex:1;" />
      <div class="scope-wrap">
        <button id="b3-scope-trigger" class="scope-trigger" aria-expanded="${state.scopeOpen}" aria-haspopup="true">
          Type: <span class="current">${TYPE_FILTER_LABELS[state.typeFilter]}</span> ▾
        </button>
        <div class="scope-menu" id="b3-scope-menu" ${state.scopeOpen ? '' : 'hidden'} role="menu">
          ${TYPE_ORDER.map((t) => `
            <button data-type="${t}" class="${t === state.typeFilter ? 'active' : ''}" role="menuitemradio" aria-checked="${t === state.typeFilter}">${TYPE_FILTER_LABELS[t]}</button>
          `).join('')}
        </div>
      </div>
    </div>

    <nav class="jump-rail" id="b3-rail" aria-label="Jump to muscle group">
      ${GROUP_ORDER.filter((g) => activeGroups.has(g)).map((g) => `
        <button class="jump-pill" data-group="${g}">${GROUP_LABELS[g]}</button>
      `).join('')}
    </nav>

    ${renderList(filtered)}
  `;
}

function wireB3(state, rerender) {
  wireCreateDisclosure('b3', state, rerender);
  const search = document.getElementById('b3-search');
  search.addEventListener('input', (e) => { state.query = e.target.value; rerender(true); });
  wireSearchFocus(search);

  const trigger = document.getElementById('b3-scope-trigger');
  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    state.scopeOpen = !state.scopeOpen;
    rerender();
  });
  document.getElementById('b3-scope-menu').querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      state.typeFilter = btn.dataset.type;
      state.scopeOpen = false;
      rerender();
    });
  });
  if (state.scopeOpen) {
    document.addEventListener('click', function closeOnce() {
      state.scopeOpen = false;
      rerender();
      document.removeEventListener('click', closeOnce);
    }, { once: true });
  }

  wireJumpRail(document.getElementById('b3-rail'));
}

// ---------------------------------------------------------------------
// Switcher plumbing
// ---------------------------------------------------------------------
const VARIANTS = {
  B1: { name: 'Segmented row', render: renderB1, wire: wireB1 },
  B2: { name: 'Merged rail', render: renderB2, wire: wireB2 },
  B3: { name: 'Popover scope', render: renderB3, wire: wireB3 },
};
const KEYS = Object.keys(VARIANTS);

const perVariantState = {
  B1: { createOpen: false, query: '', typeFilter: 'all' },
  B2: { createOpen: false, query: '', typeFilter: 'all' },
  B3: { createOpen: false, query: '', typeFilter: 'all', scopeOpen: false },
};

function getVariantFromUrl() {
  const v = new URLSearchParams(location.search).get('variant');
  return KEYS.includes(v) ? v : 'B1';
}

function setVariant(key, opts = {}) {
  const url = new URL(location.href);
  url.searchParams.set('variant', key);
  history[opts.replace ? 'replaceState' : 'pushState']({}, '', url);
  renderApp();
}

function renderApp() {
  const key = getVariantFromUrl();
  const variant = VARIANTS[key];
  const state = perVariantState[key];
  const app = document.getElementById('app');
  const scrollY = window.scrollY;
  app.innerHTML = variant.render(state);
  variant.wire(state, (preserveScroll) => {
    app.innerHTML = variant.render(state);
    variant.wire(state, () => {});
    if (preserveScroll) window.scrollTo(0, scrollY);
  });
  document.getElementById('proto-label').textContent = `${key} — ${variant.name}`;
}

document.getElementById('proto-prev').addEventListener('click', () => {
  const i = KEYS.indexOf(getVariantFromUrl());
  setVariant(KEYS[(i - 1 + KEYS.length) % KEYS.length]);
});
document.getElementById('proto-next').addEventListener('click', () => {
  const i = KEYS.indexOf(getVariantFromUrl());
  setVariant(KEYS[(i + 1) % KEYS.length]);
});
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return;
  if (e.key === 'ArrowLeft') document.getElementById('proto-prev').click();
  if (e.key === 'ArrowRight') document.getElementById('proto-next').click();
});
window.addEventListener('popstate', renderApp);

renderApp();
</script>
